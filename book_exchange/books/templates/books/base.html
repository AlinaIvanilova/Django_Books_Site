<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Обмін книгами</title>
</head>
<body>
    <nav>
        <a href="{% url 'book_list' %}">Всі книги</a>
        {% if user.is_authenticated %}
            <a href="{% url 'add_book' %}">Додати книгу</a>
            Привіт, {{ user.username }} | <a href="{% url 'logout' %}">Вийти</a>
        {% else %}
            <a href="{% url 'login' %}">Увійти</a> | <a href="{% url 'signup' %}">Реєстрація</a>
        {% endif %}
    </nav>
    <hr>

    {% block content %}
    {% endblock %}
</body>
</html>
