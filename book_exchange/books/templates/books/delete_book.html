{% extends "books/base.html" %}
{% block content %}
  <h2>Видалити книгу</h2>
  <p>Ви впевнені, що хочете видалити книгу <strong>{{ book.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Так, видалити</button>
    <a href="{% url 'book_list' %}">Скасувати</a>
  </form>
{% endblock %}
